name: techneos

services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techneos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techneos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-techneos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techneos -d techneos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO (S3-compatible object storage) ---
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Valkey (Redis-compatible cache) ---
  valkey:
    image: valkey/valkey:9.1.0
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- DevPI (Python package index for local development) ---
  devpi:
    image: pypiserver/pypiserver:v2.4.1
    restart: unless-stopped
    # The `run` subcommand is now required.
    # `-P . -a .` enables anonymous uploads and password-protection for downloads.
    command: run -P . -a . -o
    ports:
      # The container listens on 8080, which we map to 3141 on the host.
      - "3141:8080"
    volumes:
      - devpi_data:/data/packages
    environment:
      PYPISERVER_WELCOME: "DevPI - TechneOS Package Index"

  # --- MinIO bucket initialization ---
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb local/techneos-data --ignore-existing;
      echo 'MinIO buckets initialized';
      "

  # --- Keycloak Postgres database bootstrap ---
  # Keycloak creates its own schema on boot but not the database itself
  # (unlike Airflow, which self-creates via airflow-init below) — without
  # this, KC_DB_URL below needs a one-off manual `createdb keycloak` before
  # Keycloak's very first boot. Idempotent: safe to run on every startup.
  keycloak-init:
    image: postgres:16.14-alpine
    entrypoint:
      - /bin/sh
      - -c
      - |
        until pg_isready -h postgres -U "${POSTGRES_USER:-techneos}" >/dev/null 2>&1; do sleep 1; done
        psql -h postgres -U "${POSTGRES_USER:-techneos}" -d postgres -tc \
          "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 \
          || psql -h postgres -U "${POSTGRES_USER:-techneos}" -d postgres -c "CREATE DATABASE keycloak"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-techneos_dev_password}
    depends_on:
      postgres:
        condition: service_healthy

  # --- Keycloak (SSO / identity provider) ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Start Keycloak in the background
        /opt/keycloak/bin/kc.sh start-dev --import-realm &
        KC_PID=$!

        # Wait for Keycloak to become ready
        echo "Waiting for Keycloak to start..."
        until /opt/keycloak/bin/kcadm.sh config credentials \
              --server http://localhost:8080 \
              --realm master \
              --user "$${KEYCLOAK_ADMIN}" \
              --password "$${KEYCLOAK_ADMIN_PASSWORD}" 2>/dev/null; do
          sleep 2
        done

        # Disable SSL on the master realm so the admin console works over HTTP
        echo "Disabling SSL requirement on master realm..."
        /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE
        echo "Master realm SSL requirement set to NONE."

        # Bring Keycloak back to foreground
        wait $$KC_PID
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-techneos}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-techneos_dev_password}
      PLATFORM_SITE_NAME: ${PLATFORM_SITE_NAME:-TechneOS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-not-set}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-not-set}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-github-client-id-not-set}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-github-client-secret-not-set}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-techneos_dev_client_secret}
    ports:
      - "8080:8080"
    volumes:
      - ./techneos-realm.keycloak.json:/opt/keycloak/data/import/techneos-realm.keycloak.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # --- Apache Airflow (pipeline orchestration) ---
  airflow-init:
    image: apache/airflow:2.9.0-python3.12
    entrypoint:
      - /bin/bash
      - -c
      - |
        python << 'PYEOF'
        import psycopg2
        conn = psycopg2.connect(
            host="postgres", user="${POSTGRES_USER:-techneos}",
            password="${POSTGRES_PASSWORD:-techneos_dev_password}", dbname="postgres"
        )
        conn.autocommit = True
        cur = conn.cursor()
        cur.execute("SELECT 1 FROM pg_database WHERE datname='airflow'")
        if not cur.fetchone():
            cur.execute("CREATE DATABASE airflow")
            print("Created airflow database")
        else:
            print("Airflow database already exists")
        cur.close()
        conn.close()
        PYEOF
        airflow db migrate
        airflow users create --role Admin --username ${AIRFLOW_USERNAME:-airflow} --password ${AIRFLOW_PASSWORD:-airflow} --email admin@techneos.local --firstname Admin --lastname TechneOS || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-techneos}:${POSTGRES_PASSWORD:-techneos_dev_password}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-techneos-airflow-dev-secret-key}
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.9.0-python3.12
    restart: unless-stopped
    command: webserver
    environment:
      PYTHONPATH: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-techneos}:${POSTGRES_PASSWORD:-techneos_dev_password}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-techneos-airflow-dev-secret-key}
      _PIP_ADDITIONAL_REQUIREMENTS: "minio>=7.2"
      # Platform callback URL (reachable from within Docker network)
      PLATFORM_CALLBACK_URL: http://host.docker.internal:8000
      AIRFLOW_DAG_ID: ${AIRFLOW_DAG_ID:-techneos_airflow_pipeline}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      COMPUTE_BACKEND: docker
      # AWS Batch (optional — set COMPUTE_BACKEND=aws_batch to use)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_BATCH_JOB_QUEUE: ${AWS_BATCH_JOB_QUEUE:-techneos-job-queue}
      AWS_BATCH_JOB_DEFINITION: ${AWS_BATCH_JOB_DEFINITION:-techneos-tool-job}
      AWS_BATCH_WORK_BUCKET: ${AWS_BATCH_WORK_BUCKET:-techneos-aws-batch-shared-data}
      # MinIO connection (host.docker.internal for access from Docker)
      MINIO_ENDPOINT: host.docker.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: techneos-data
      MINIO_SECURE: "false"
      # DAG retry configuration
      AIRFLOW_TASK_RETRIES: "1"
      AIRFLOW_RETRY_DELAY_MINUTES: "1"
      AIRFLOW_EXECUTION_TIMEOUT_HOURS: "24"
    volumes:
      - ./packages/execution/dags:/opt/airflow/dags
      - ./packages/execution/operators:/opt/airflow/operators
      - ./packages/execution/callbacks:/opt/airflow/callbacks
      - ./packages/execution/backends:/opt/airflow/backends
      - ./packages/execution/storage:/opt/airflow/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.dev-tmp/inputs:/tmp/techneos-shared-inputs
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    image: apache/airflow:2.9.0-python3.12
    restart: unless-stopped
    command: scheduler
    environment:
      PYTHONPATH: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-techneos}:${POSTGRES_PASSWORD:-techneos_dev_password}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-techneos-airflow-dev-secret-key}
      _PIP_ADDITIONAL_REQUIREMENTS: "minio>=7.2"
      PLATFORM_CALLBACK_URL: http://host.docker.internal:8000
      AIRFLOW_DAG_ID: ${AIRFLOW_DAG_ID:-techneos_airflow_pipeline}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      COMPUTE_BACKEND: docker
      # AWS Batch (optional — set COMPUTE_BACKEND=aws_batch to use)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_BATCH_JOB_QUEUE: ${AWS_BATCH_JOB_QUEUE:-techneos-job-queue}
      AWS_BATCH_JOB_DEFINITION: ${AWS_BATCH_JOB_DEFINITION:-techneos-tool-job}
      AWS_BATCH_WORK_BUCKET: ${AWS_BATCH_WORK_BUCKET:-techneos-aws-batch-shared-data}
      # Shared temp directory for passing downloaded files to sibling containers
      DOCKER_NETWORK: ${DOCKER_NETWORK_NAME:-techneos}
      TECHNEOS_SHARED_INPUT_DIR: /tmp/techneos-shared-inputs
      TECHNEOS_HOST_SHARED_INPUT_DIR: ${PWD}/.dev-tmp/inputs
      # Tool execution image — build locally via
      # `uv run python setup/wheels/publish_tool_runtime.py --skip-register`.
      TECHNEOS_RUNTIME_IMAGE: ${TECHNEOS_RUNTIME_IMAGE:-techneos/tool-runtime}
      TECHNEOS_RUNTIME_IMAGE_TAG: ${TECHNEOS_RUNTIME_IMAGE_TAG:-latest}
      # MinIO connection (host.docker.internal for access from Docker)
      MINIO_ENDPOINT: host.docker.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: techneos-data
      MINIO_SECURE: "false"
      # DAG retry configuration
      AIRFLOW_TASK_RETRIES: "1"
      AIRFLOW_RETRY_DELAY_MINUTES: "1"
      AIRFLOW_EXECUTION_TIMEOUT_HOURS: "24"
    volumes:
      - ./packages/execution/dags:/opt/airflow/dags
      - ./packages/execution/operators:/opt/airflow/operators
      - ./packages/execution/callbacks:/opt/airflow/callbacks
      - ./packages/execution/backends:/opt/airflow/backends
      - ./packages/execution/storage:/opt/airflow/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.dev-tmp/inputs:/tmp/techneos-shared-inputs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  valkey_data:
  devpi_data:

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-techneos}
