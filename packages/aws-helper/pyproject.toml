[project]
name = "techneos-aws"
version = "0.1.0"
description = "AWS primitives for the TechneOS platform — ECR + CodeArtifact + a boto3 client factory. Consumed by the services that publish/pull artifacts; deliberately NOT a gateway dependency."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
