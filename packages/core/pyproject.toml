[project]
name = "core"
version = "0.1.0"
description = "Shared core library for TechneOS"
requires-python = ">=3.12"
dependencies = [
    "techneos-tool-runtime",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "minio>=7.2",
    "valkey>=6.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "motor>=3.6",
    "openai>=1.40",
    "pydantic-ai>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.uv.sources]
techneos-tool-runtime = { workspace = true }

# NOTE: core deliberately has no other [tool.uv.sources] entries — it must
# not depend on anything in catalog/. Optional Platform Assistant tools
# contributed by catalog packages are discovered at runtime via the
# `techneos.platform_assistant_tools` entry-point group (consumed by the
# techneos-platform-assistant package: platform_assistant/tools.py).
#
# techneos-tool-runtime is exempt because it's a sibling workspace package
# that owns the InputKind registry — core needs it to validate tool
# input_schema at registration time.
