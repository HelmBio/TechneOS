[project]
name = "execution"
version = "0.1.0"
description = "Airflow DAGs and operators for TechneOS"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=2.9",
    "httpx>=0.27",
    "docker>=7.0",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dags", "operators", "callbacks", "backends", "storage"]
