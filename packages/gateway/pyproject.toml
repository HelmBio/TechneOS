[project]
name = "gateway"
version = "0.1.0"
description = "API Gateway for TechneOS"
requires-python = ">=3.12"
dependencies = [
    "core",
    "httpx>=0.27",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
