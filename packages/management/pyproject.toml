[project]
name = "techneos-management"
version = "0.1.0"
description = "Management scripts for TechneOS — resource deletion, cleanup, and admin operations"
requires-python = ">=3.12"
# The removal scripts are stdlib-only; registration adds these.
# boto3 is used to mint a fresh CodeArtifact token at `uv publish` time.
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/management"]
