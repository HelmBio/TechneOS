[project]
name = "agent-service"
version = "0.1.0"
description = "AI agent service for TechneOS"
requires-python = ">=3.12"
dependencies = [
    "core",
    "techneos-aws",
    "techneos-platform-assistant",
]

[tool.uv.sources]
core = { workspace = true }
techneos-aws = { workspace = true }
techneos-platform-assistant = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]
