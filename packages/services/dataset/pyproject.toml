[project]
name = "dataset-service"
version = "0.1.0"
description = "Dataset management service for TechneOS"
requires-python = ">=3.12"
dependencies = [
    "core",
    "jsonschema>=4.20",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_service"]
