[project]
name = "tool-service"
version = "0.1.0"
description = "Tool registry service for TechneOS"
requires-python = ">=3.12"
dependencies = [
    "core",
    "techneos-aws",
]

[tool.uv.sources]
core = { workspace = true }
techneos-aws = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_service"]
