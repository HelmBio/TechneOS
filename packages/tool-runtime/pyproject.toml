[project]
name = "techneos-tool-runtime"
version = "0.1.0"
description = "Shared runtime for TechneOS tools: generic container entry point, I/O helpers, and the run(inputs, params) contract."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.28",
]

[project.scripts]
techneos-tool-runner = "techneos_tool_runtime.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techneos_tool_runtime"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
