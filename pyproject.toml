[project]
name = "techneos"
version = "0.1.0"
description = "AI-powered data and computing platform for drug discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/tool-runtime",
    "packages/platform-assistant",
    "packages/gateway",
    "packages/services/auth",
    "packages/services/dataset",
    "packages/services/tool",
    "packages/services/task",
    "packages/services/pipeline",
    "packages/services/agent",
    "packages/services/notification",
    "packages/services/app",
    "packages/cli",
    "packages/management",
]
# NOTE: catalog content (tools, agents, datasets, pipelines, apps) is authored
# in a separate repository — it depends on the platform only via the published
# techneos-tool-runtime / techneos-management wheels and the gateway REST API,
# never as a workspace member.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# build_and_register.py files are deploy-time operational scripts (not part of
# the wheels); excluded from lint/typecheck here — same as the mypy exclude.
exclude = ["migrations/versions/*", "**/build_and_register.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # Depends() in function defaults is standard FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"**/seed.py" = ["T201"]  # print is fine in seed scripts
"**/register_compute_artifacts.py" = ["T201"]  # deploy-stage ingest script prints progress
"**/main.py" = ["T201"]  # print is fine in startup/shutdown
"**/events.py" = ["T201"]  # print for dev-visible event logging
"**/crud/versions.py" = ["T201"]  # print for dev-visible event logging
"packages/cli/**" = ["T201"]  # CLI prints to terminal
"packages/management/**" = ["T201"]  # management scripts print to terminal

[tool.ruff.lint.isort]
known-first-party = ["core", "gateway", "auth_service", "dataset_service", "tool_service", "task_service", "pipeline_service", "agent_service", "notification_service", "cli", "management", "techneos_tool_runtime"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Excluded from type checking:
#  - build_and_register.py: a standalone publish script that imports the
#    `management` client toolkit ambiently from the dev workspace (not
#    importable library code).
#  - tests: exercised by pytest, not part of the strict-typed library surface.
exclude = ["/build_and_register\\.py$", "/tests/"]

[[tool.mypy.overrides]]
# Third-party packages without type stubs / py.typed markers.
module = [
    "minio.*", "jose.*", "bcrypt.*", "boto3.*", "botocore.*",
    "docker.*", "jsonschema.*", "pyarrow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Treat as Any (don't analyze):
#  - valkey: installed but ships no type information (calls read as untyped).
#  - rdkit: an optional runtime dependency provided by tool images, not installed
#    in the platform environment; its published stubs also carry an upstream
#    syntax error, so skip them if it ever is installed.
module = ["valkey.*", "rdkit.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

